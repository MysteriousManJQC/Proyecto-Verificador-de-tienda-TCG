{% extends "base.html" %}

{% block titulo %}{{ accion }} Registro - Verificador TCG{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">{{ accion }} Registro</h3>
            </div>
            <div class="card-body">
                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="nombre_carta" class="form-label">Nombre de la carta</label>
                        <input type="text" class="form-control" id="nombre_carta" name="nombre_carta"
                               value="{{ registro.nombre_carta|default:'' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="expansion" class="form-label">Expansión</label>
                        <input type="text" class="form-control" id="expansion" name="expansion"
                               value="{{ registro.expansion|default:'' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="cantidad_solicitada" class="form-label">Cantidad solicitada</label>
                        <input type="number" class="form-control" id="cantidad_solicitada" name="cantidad_solicitada"
                               value="{{ registro.cantidad_solicitada|default:'' }}" min="1" max="10000" required>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">💾 {{ accion }}</button>
                        <a href="{% url 'lista' %}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
